name: Validate harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate Python quality
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Validate skills and model profiles
        run: |
          python scripts/validate-skills.py skills
          python scripts/validate-model-profiles.py

      - name: Validate harness efficiency evaluation matrix
        run: python scripts/validate-efficiency-evaluation.py

      - name: Validate Computer Use backend evaluation matrix
        run: python scripts/validate-computer-use-backend-evaluation.py

      - name: Validate repository invariants
        run: |
          test "$(wc -c < AGENTS.md)" -le 32768
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Validate hook
        run: |
          test "$(git ls-files -s -- .githooks/pre-commit | awk '{print $1}')" = '100755'
          bash -n .githooks/pre-commit
          bash tests/test-pre-commit.sh
